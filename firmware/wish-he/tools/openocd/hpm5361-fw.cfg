# hpm5300evk (HPM5361) / 온보드 FT2232 프로브
#
# hpm_sdk 의 hpm5300_all_in_one.cfg 를 대체한다.
# 원본은 HPM_SDK_BASE 환경변수를 요구하지만 본 프로젝트는 hpm_sdk 에 의존하지 않으므로
# 필요한 cfg 를 tools/openocd/ 아래로 복사해두고 상대 경로로 참조한다.
#
# 사용법 (-s 로 이 디렉토리를 스크립트 검색 경로에 넣어야 [find ...] 가 풀린다):
#   openocd -s tools/openocd -f hpm5361-fw.cfg
#
# 플래시 기록:
#   openocd -s tools/openocd -f hpm5361-fw.cfg \
#           -c "init; halt; program build/hpm5361-fw.elf verify; reset; exit"

source [find probes/ft2232.cfg]
source [find soc/hpm5300.cfg]
source [find boards/hpm5300evk.cfg]
