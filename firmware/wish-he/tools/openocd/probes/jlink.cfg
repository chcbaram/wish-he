# SEGGER J-Link / JTAG
#
# 주의: HPMicro 배포 OpenOCD 바이너리에는 jlink 드라이버가 빌드돼 있지 않다.
#       (지원 목록에 ftdi / cmsis-dap / st-link 는 있으나 jlink 없음)
#       따라서 이 프로브는 jlink 를 포함한 OpenOCD 로만 쓸 수 있다.
#         - homebrew openocd  : jlink 있음 / hpm_xpi 없음  -> 읽기·디버깅용
#         - HPMicro openocd   : jlink 없음 / hpm_xpi 있음  -> 플래시 기록용
#       둘 다 필요하면 HPMicro 소스를 --enable-jlink 로 직접 빌드해야 한다.
#
# 배선: 20핀 표준 JTAG. 신호 이름은 타겟 기준이므로 같은 이름끼리 직결한다.
#       1번 VTref 에 타겟 전원이 반드시 들어와야 J-Link 가 출력을 낸다.

adapter driver jlink
transport select jtag
adapter speed 1000
