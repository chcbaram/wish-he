<text xml:space="preserve" x="40" y="60" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif" font-size="12" fill="#6a737d" text-anchor="start" font-weight="400">숫자는 전부 실측값. 괄호 안은 12비트로 내리기 전 원시 16비트.</text>
