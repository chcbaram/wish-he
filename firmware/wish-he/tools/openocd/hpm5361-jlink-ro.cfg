# HPM5361 + J-Link / **읽기 전용**
#
# 플래시 뱅크를 선언하지 않으므로 hpm_xpi 드라이버가 없는 OpenOCD(homebrew 등)에서도
# 그대로 돈다. 플래시는 XIP 창(0x80000000)을 메모리로 읽는 방식이라
# 타겟 RAM 에 플래시 로더를 올리지 않고, halt 도 필요 없다.
#
# 사용법:
#   openocd -s tools/openocd -f hpm5361-jlink-ro.cfg -c "init; scan_chain; exit"
#
#   # 1MB 덤프 (halt 없이, running 상태 그대로)
#   openocd -s tools/openocd -f hpm5361-jlink-ro.cfg \
#           -c "init" -c "riscv set_mem_access sysbus progbuf abstract" \
#           -c "dump_image flash.bin 0x80000000 0x100000" -c "exit"
#
# 덤프 중 반복되는 "Failed to read priv register" 는 특권 레벨 조회 실패로 무해하다
# (4KB 당 1회). 데이터에는 영향이 없다.

source [find probes/jlink.cfg]

set _CHIP hpm5361
jtag newtap $_CHIP cpu -irlen 5 -expected-id 0x1000563D

set _TARGET0 $_CHIP.cpu0
target create $_TARGET0 riscv -chain-position $_CHIP.cpu -coreid 0
targets $_TARGET0

# work-area 를 주지 않는다 -> OpenOCD 가 타겟 RAM 을 건드리지 않는다.
# reset 이벤트도 걸지 않는다 -> 붙는 것만으로 타겟이 리셋되지 않는다.
reset_config none
