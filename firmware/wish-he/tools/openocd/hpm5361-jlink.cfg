# HPM5361 + J-Link / 전체 기능 (플래시 기록 포함)
#
# hpm5361-fw.cfg 의 J-Link 판. 프로브만 ft2232 -> jlink 로 바꾼 것이다.
#
# !! 이 설정은 jlink 드라이버와 hpm_xpi 플래시 드라이버를 **둘 다** 가진
#    OpenOCD 를 요구한다. 배포 바이너리에는 그런 게 없으므로
#    HPMicro OpenOCD 소스를 --enable-jlink 로 빌드해서 써야 한다.
#    읽기만 필요하면 hpm5361-jlink-ro.cfg 를 쓸 것.
#
# 플래시 기록:
#   openocd -s tools/openocd -f hpm5361-jlink.cfg \
#           -c "init; halt; program build/hpm5361-fw.elf verify; reset; exit"

source [find probes/jlink.cfg]
source [find soc/hpm5300.cfg]
source [find boards/hpm5300evk.cfg]
